name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.workspace }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: ["@mango/marketplace", "@mango/core", "@mango/db"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w ${{ matrix.workspace }} --if-present
      - name: Lint
        run: npm run lint -w ${{ matrix.workspace }} --if-present
      - name: Unit tests
        run: npm run test -w ${{ matrix.workspace }} --if-present
