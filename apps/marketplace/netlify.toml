# Netlify site: bike-booking-th (Moto Mangos marketplace).
# Site settings: Base directory unset (repo root), Package directory =
# apps/marketplace. Netlify reads this file from the package directory, but
# every path here is relative to the base directory (the repo root), and
# install and build run at the root, where the one package-lock.json lives.
# Netlify detects Next.js and applies its OpenNext adapter automatically.
[build]
  command = "npm run build -w @mango/marketplace"
  publish = "apps/marketplace/.next"
  # Skip the build when nothing the marketplace depends on changed, so
  # platform work doesn't spend marketplace deploy credits. Exit 0 = skip.
  ignore = "bash apps/marketplace/scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "24"

[functions]
  # The default is <base>/netlify/functions (the repo root), so point it at
  # the marketplace's own functions (supabase-keep-alive).
  directory = "apps/marketplace/netlify/functions"
